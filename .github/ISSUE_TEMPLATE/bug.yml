name: Erro
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Conte o que você fez e o que viu.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra #/perto\n2. Escolha...\n3. ..."
  - type: input
    id: ambiente
    attributes:
      label: Navegador e aparelho
      placeholder: Chrome 130 no Android 14
  - type: dropdown
    id: modo
    attributes:
      label: Modo de dados
      options: ["Local (teste)", "Compartilhado (Supabase)", "Não sei"]
