name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe dos módulos JavaScript
        run: npm run check
      - name: Testes
        run: npm test
      - name: Sintaxe do script de dados (Python)
        run: python3 -m py_compile scripts/gerar_bairros.py
