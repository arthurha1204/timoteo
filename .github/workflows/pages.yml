name: Publicar no GitHub Pages

# Manual de propósito: publicar o site é uma decisão. Para publicar a cada push na main,
# adicione "push: { branches: [main] }" abaixo de "on:".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reunir só o que o site precisa
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
