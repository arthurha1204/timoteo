# Réplica local do banco compartilhado: Postgres + PostgREST (a mesma camada REST que o Supabase usa).
# Serve para testar o esquema e as regras de acesso (RLS) sem conta em nada.
# Uso: veja supabase/teste-local/README.md
name: timoteo-teste
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: timoteo
    ports:
      - "54329:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timoteo"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:dev@db:5432/timoteo
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "segredo-so-para-testes-locais-com-mais-de-32-caracteres"
      PGRST_DB_MAX_ROWS: "1000"
    ports:
      - "54330:3000"
